<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Happy Birthday Abhi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&family=Yuji+Syuku&family=Noto+Sans+JP:wght@900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --u: 1vh; --red: #ff1a2e; --pink: #ff2fa8; --dark: #4a0012; --ink: #0a0208;
    --font: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --jp: 'Yuji Syuku', 'Noto Sans JP', serif;
    --marker: 'Nunito', system-ui, sans-serif;
    --noise: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; color: #fff; font-family: var(--font); user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; overscroll-behavior: none; -webkit-touch-callout: none; }

  #stage { position: fixed; inset: 0; overflow: hidden; background: #000; perspective: 1200px; perspective-origin: 50% 48%; }
  #bg0 { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 62%, #240718 0%, #07010a 68%); transition: opacity 1.2s; }
  #aura { position: absolute; inset: 0; background: radial-gradient(circle at 50% 50%, rgba(255,47,130,0.55), transparent 58%); opacity: 0; transition: opacity 1.2s; }
  #godrays { position: absolute; left: 50%; top: 50%; width: 200vmax; height: 200vmax; margin: -100vmax 0 0 -100vmax; opacity: 0; transition: opacity 0.9s; pointer-events: none;
    background: repeating-conic-gradient(from 0deg, rgba(255,60,140,0.4) 0deg 4deg, transparent 4deg 14deg); animation: spin 40s linear infinite;
    -webkit-mask-image: radial-gradient(circle, #000 0%, transparent 40%); mask-image: radial-gradient(circle, #000 0%, transparent 40%); }
  #godrays.on { opacity: 1; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #world { position: absolute; inset: 0; transform-style: preserve-3d; will-change: transform; }

  /* ---------- rib cage world (transform-only animation = smooth) ---------- */
  #ribs { position: absolute; left: -50%; top: -50%; width: 200%; height: 200%; transform: translateZ(-650px); opacity: 0; transition: opacity 1.4s; background: #07010a; will-change: transform; }
  #ribs.on { opacity: 1; }
  .ribHalf { position: absolute; top: 0; bottom: 0; width: 50%; overflow: hidden; }
  .ribHalf.L { left: 0; transform-origin: 100% 50%; transform: skewY(-9deg); }
  .ribHalf.R { right: 0; transform-origin: 0% 50%; transform: skewY(9deg); }
  .ribBand { position: absolute; left: 0; right: 0; top: -120px; height: calc(100% + 240px); will-change: transform;
    background: repeating-linear-gradient(180deg, #ff4fb8 0px, #ff4fb8 3px, #3a0f26 4px, #1d0716 40px, #07010a 84px, #07010a 90px, #ff1d33 90px, #ff3a4a 98px, #b0102a 108px, #6a0a1c 118px, #6a0a1c 120px);
    animation: ribMove 7s linear infinite; }
  @keyframes ribMove { to { transform: translateY(120px); } }
  #spine { position: absolute; left: 50%; top: 0; bottom: 0; width: 9%; transform: translateX(-50%); overflow: hidden;
    border-left: 3px solid rgba(255,47,168,0.55); border-right: 3px solid rgba(255,47,168,0.55); box-shadow: 0 0 80px #000, inset 0 0 40px #000; }
  .spineBand { position: absolute; left: 0; right: 0; top: -72px; height: calc(100% + 144px); will-change: transform;
    background: repeating-linear-gradient(180deg, #24102a 0px, #2f1536 46px, #0a0310 60px, #0a0310 72px); animation: spineMove 9s linear infinite; }
  @keyframes spineMove { to { transform: translateY(72px); } }
  #ribHatch { position: absolute; inset: 0; background: repeating-linear-gradient(104deg, transparent 0 5px, rgba(0,0,0,0.3) 5px 6px); }
  #ribGlow { position: absolute; inset: 0; background: radial-gradient(circle at 50% 56%, rgba(255,20,60,0.5), transparent 45%), radial-gradient(circle at 50% 100%, rgba(255,47,168,0.45), transparent 40%); }
  #big21 { position: absolute; left: 50%; top: 50%; transform: translate3d(-50%, -50%, -260px); font-size: 58vmax; line-height: 1; color: transparent; -webkit-text-stroke: 3px rgba(255,47,168,0.5); text-shadow: 0 0 60px rgba(255,20,100,0.4); opacity: 0; transition: opacity 1.5s; pointer-events: none; }
  #big21.on { opacity: 1; }

  .horn { position: absolute; pointer-events: none; }
  .horn svg { width: 100%; height: 100%; overflow: visible; fill: var(--ink); stroke: var(--pink); stroke-width: 2.5; filter: drop-shadow(0 0 8px rgba(255,47,168,0.8)); opacity: 0; }
  .skull { position: absolute; pointer-events: none; }
  .skull svg { width: 100%; height: 100%; overflow: visible; fill: #272238; stroke: var(--pink); stroke-width: 2.5; filter: drop-shadow(0 0 8px rgba(255,47,168,0.55)); opacity: 0; }

  /* ---------- character: LEFT side ---------- */
  #charWrap { position: absolute; left: -160%; bottom: 0; height: calc(var(--u) * 94); width: calc(calc(var(--u) * 94) * 0.5625); transform: translateZ(40px) scale(1.4); transform-origin: 50% 100%;
    transition: left 1.1s cubic-bezier(.12,.9,.2,1), transform 1.1s cubic-bezier(.12,.9,.2,1); }
  #charWrap.in { left: 2%; transform: translateZ(40px) scale(1); }
  #charWrap.float { animation: float 4.2s ease-in-out infinite; }
  @keyframes float { 50% { transform: translateZ(40px) translateY(-10px); } }
  #charGlow { position: absolute; inset: -25% -45%; background: radial-gradient(circle, rgba(255,47,168,0.6), transparent 62%); filter: blur(10px); }
  #charInner { position: absolute; inset: 0; transform-origin: 52% 24%; }
  #charInner img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; object-position: bottom; opacity: 0; filter: drop-shadow(0 0 4px var(--pink)) drop-shadow(0 0 28px rgba(255,47,168,0.6)); }
  #charInner img.show { opacity: 1; }
  #charInner img.portrait { filter: none; object-fit: cover; object-position: 50% 100%;
    -webkit-mask-image: linear-gradient(to right, transparent 0%, #000 24%, #000 76%, transparent 100%), linear-gradient(to bottom, transparent 0%, #000 14%, #000 100%);
    -webkit-mask-composite: source-in;
    mask-image: linear-gradient(to right, transparent 0%, #000 24%, #000 76%, transparent 100%), linear-gradient(to bottom, transparent 0%, #000 14%, #000 100%);
    mask-composite: intersect; animation: breathe 6s ease-in-out infinite; transform-origin: 50% 60%; }
  @keyframes breathe { 50% { transform: scale(1.025); } }

  /* ---------- 3D envelope + letter ---------- */
  #rig { position: absolute; inset: 0; transform-style: preserve-3d; animation: idle 5s ease-in-out infinite; }
  @keyframes idle { 50% { transform: translateY(-10px) rotateX(3deg); } }
  .box3d { --w: min(82vw, 380px); position: absolute; left: 50%; top: 50%; width: var(--w); height: calc(var(--w) * 0.66); margin-left: calc(var(--w) / -2); margin-top: calc(var(--w) * -0.33); }
  #env { transform-style: preserve-3d; cursor: pointer; }
  .eShadow { position: absolute; left: 4%; right: 4%; bottom: -16%; height: 14%; background: radial-gradient(ellipse, rgba(255,30,90,0.5), transparent 70%); filter: blur(9px); transform: translateZ(-2px); }
  .eBack { position: absolute; inset: 0; border-radius: 4px; transform: translateZ(0); background: var(--noise), linear-gradient(160deg, #3a0a18, #1b050c); background-blend-mode: soft-light, normal; box-shadow: 0 0 60px rgba(255,26,46,0.35); }
  .ePocket { position: absolute; inset: 0; transform: translateZ(3px); clip-path: polygon(0 0, 50% 58%, 100% 0, 100% 100%, 0 100%);
    background: var(--noise), linear-gradient(115deg, rgba(255,255,255,0.0) 40%, rgba(0,0,0,0.35) 100%), linear-gradient(160deg, #6c1228, #2c0813); background-blend-mode: soft-light, normal, normal; }
  .ePocket::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to bottom right, transparent 49.2%, rgba(255,47,168,0.55) 49.6%, transparent 50.4%), linear-gradient(to bottom left, transparent 49.2%, rgba(255,47,168,0.55) 49.6%, transparent 50.4%); }
  .eText { position: absolute; left: 0; right: 0; top: 9%; text-align: center; transform: translateZ(5px); pointer-events: none; }
  .eText .for { font-family: var(--marker); font-size: calc(var(--w) * 0.05); color: #ff7a9a; letter-spacing: 0.2em; }
  .eText .who { font-size: calc(var(--w) * 0.15); letter-spacing: 0.1em; color: #fff; text-shadow: 0 0 18px var(--red), 3px 3px 0 #2a0612; line-height: 1.05; }
  .flapWrap { position: absolute; left: 0; right: 0; top: 0; height: 58%; transform-origin: 50% 0; transform-style: preserve-3d; transform: translateZ(4px) rotateX(0deg); }
  .fFront, .fBack { position: absolute; inset: 0; clip-path: polygon(0 0, 100% 0, 50% 100%); backface-visibility: hidden; -webkit-backface-visibility: hidden; }
  .fFront { background: var(--noise), linear-gradient(170deg, #8a1634, #3c0a1a); background-blend-mode: soft-light, normal; }
  .fFront::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to bottom right, transparent 49.2%, rgba(255,47,168,0.7) 49.7%, transparent 50.6%), linear-gradient(to bottom left, transparent 49.2%, rgba(255,47,168,0.7) 49.7%, transparent 50.6%); }
  .fBack { transform: rotateY(180deg); background: repeating-linear-gradient(45deg, #5a1030 0 9px, #3a0a20 9px 18px), #3a0a20; }
  .fBack::after { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at 50% 10%, rgba(255,47,168,0.6), transparent 65%); }
  .seal { position: absolute; left: 50%; top: 100%; width: calc(var(--w) * 0.19); height: calc(var(--w) * 0.19); margin: calc(var(--w) * -0.095) 0 0 calc(var(--w) * -0.095); border-radius: 50% 46% 52% 48%;
    background: radial-gradient(circle at 34% 28%, #ff6c8c, #d10a38 52%, #6a0018); box-shadow: 0 6px 18px rgba(0,0,0,0.6), 0 0 28px rgba(255,26,46,0.7), inset 0 0 0 calc(var(--w) * 0.008) rgba(255,255,255,0.18);
    display: grid; place-items: center; font-family: var(--jp); font-size: calc(var(--w) * 0.12); color: #3a0010; text-shadow: 0 1px 0 rgba(255,255,255,0.35); transform: translateZ(2px); backface-visibility: hidden; -webkit-backface-visibility: hidden; animation: sealPulse 2s ease-in-out infinite; }
  @keyframes sealPulse { 50% { box-shadow: 0 6px 18px rgba(0,0,0,0.6), 0 0 54px rgba(255,47,168,0.95), inset 0 0 0 calc(var(--w) * 0.008) rgba(255,255,255,0.18); } }

  #letter { transform: translate3d(0, 0, 1px) rotateZ(0deg); }
  .face { position: absolute; left: 6%; right: 6%; top: 3%; bottom: 7%; color: #140509; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: calc(var(--w) * 0.02);
    background: var(--noise), linear-gradient(160deg, #f1e7d6, #d2bfa0); background-blend-mode: multiply, normal;
    clip-path: polygon(0 1%, 3% 0, 97% 1%, 100% 0, 99% 98%, 100% 100%, 2% 99%, 0 100%); box-shadow: 0 0 40px rgba(255,26,46,0.5); }
  .face::before { content: ''; position: absolute; inset: 5%; border: 3px double #c2132b; pointer-events: none; }
  .face .l1 { font-family: var(--jp); color: #c2132b; font-size: calc(var(--w) * 0.07); letter-spacing: 0.35em; padding-left: 0.35em; }
  .face .l2 { font-size: calc(var(--w) * 0.21); letter-spacing: 0.06em; color: #120408; line-height: 1; transform: rotate(-2deg); text-shadow: 3px 3px 0 rgba(194,19,43,0.35); }
  .face .l3 { font-family: var(--marker); font-size: calc(var(--w) * 0.05); color: #c2132b; transform: rotate(-1deg); }
  .face .stamp { position: absolute; right: 9%; top: 9%; width: calc(var(--w) * 0.12); aspect-ratio: 1; background: #c2132b; color: #f6ead9; font-size: calc(var(--w) * 0.075); display: grid; place-items: center; transform: rotate(8deg); box-shadow: inset 0 0 0 3px #f6ead9; }
  .face .ghost { position: absolute; left: 9%; bottom: 6%; font-family: var(--jp); font-size: calc(var(--w) * 0.2); color: rgba(194,19,43,0.14); line-height: 1; }
  #hint { position: absolute; left: 0; right: 0; bottom: calc(var(--u) * 11); text-align: center; z-index: 30; font-size: 13px; letter-spacing: 6px; color: #ff9bb4; text-shadow: 0 0 12px var(--red); animation: blink 1.6s ease-in-out infinite; cursor: pointer; }
  @keyframes blink { 50% { opacity: 0.25; } }
  #shards { position: absolute; inset: 0; z-index: 36; perspective: 900px; pointer-events: none; }
  .shard { margin: 0 !important; }
  .chip { position: absolute; z-index: 38; background: #ff2a50; box-shadow: 0 0 12px #ff2fa8; pointer-events: none; }

  /* ---------- overlays ---------- */
  #embers, #speed, #sparks, #confetti, #bolts, #fw, #warp { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #embers { z-index: 8; }
  #grain { position: absolute; inset: -20%; z-index: 60; pointer-events: none; opacity: 0.05; animation: grain 0.6s steps(4) infinite; background-image: var(--noise); }
  @keyframes grain { 0% { transform: translate(0,0); } 25% { transform: translate(-2%,1%); } 50% { transform: translate(1%,-2%); } 75% { transform: translate(2%,2%); } 100% { transform: translate(0,0); } }
  #scan { position: absolute; inset: 0; z-index: 61; pointer-events: none; opacity: 0.05; background: repeating-linear-gradient(0deg, rgba(0,0,0,0.5) 0px, rgba(0,0,0,0.5) 1px, transparent 1px, transparent 3px); }
  #vig { position: absolute; inset: 0; z-index: 59; pointer-events: none; background: radial-gradient(ellipse at center, transparent 42%, rgba(0,0,0,0.88) 100%); }
  #chroma { position: absolute; inset: 0; z-index: 62; pointer-events: none; opacity: 0; box-shadow: inset 22px 0 60px rgba(255,0,70,0.45), inset -22px 0 60px rgba(0,229,255,0.4); }
  .bar { position: absolute; left: 0; right: 0; height: 0; background: #000; z-index: 58; transition: height 0.9s cubic-bezier(.2,.8,.2,1); }
  #barTop { top: 0; } #barBot { bottom: 0; }
  .bar.on { height: calc(var(--u) * 8); }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; z-index: 70; pointer-events: none; }
  #black { position: absolute; inset: 0; background: #000; z-index: 71; display: none; }
  #invert { position: absolute; inset: 0; z-index: 72; pointer-events: none; display: none; background: #fff; mix-blend-mode: difference; }
  #slashes { position: absolute; inset: 0; z-index: 37; pointer-events: none; }
  .slash { position: absolute; height: 6px; transform-origin: left center; opacity: 0; background: linear-gradient(90deg, transparent, #fff 20%, var(--pink) 70%, transparent); box-shadow: 0 0 20px 5px var(--red); }
  .ring { position: absolute; left: 50%; top: 50%; width: 30vmin; height: 30vmin; margin: -15vmin 0 0 -15vmin; border: 5px solid var(--pink); border-radius: 50%; box-shadow: 0 0 30px var(--pink), inset 0 0 30px var(--pink); pointer-events: none; z-index: 33; opacity: 0; }

  /* scene wipes + episode title card */
  .wipe { position: absolute; inset: 0; z-index: 65; pointer-events: none; clip-path: polygon(-40% 0, -20% 0, -40% 100%, -60% 100%); }
  .wipe.pink { background: var(--pink); z-index: 64; display: none; }
  .wipe.black { background: #050005; overflow: hidden; }
  .epi { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    background: radial-gradient(circle at 50% 50%, #2a0718 0%, #050005 70%); }
  .epi::before { content: ''; position: absolute; inset: 0; opacity: 0.22; background-image: radial-gradient(circle, var(--pink) 22%, transparent 24%); background-size: 16px 16px;
    -webkit-mask-image: radial-gradient(circle, #000 0%, transparent 70%); mask-image: radial-gradient(circle, #000 0%, transparent 70%); }
  .epi .t1 { position: relative; font-size: clamp(18px, 3vw, 40px); letter-spacing: 0.45em; color: #ffd0e6; padding-left: 0.55em; }
  .epi .t2 { position: relative; font-family: var(--jp); font-size: clamp(60px, min(calc(var(--u) * 30), 26vw), 320px); line-height: 1.05; white-space: nowrap; color: #fff; text-shadow: 0 0 40px var(--pink), 8px 8px 0 var(--dark); }
  .epi .stack { position: relative; }
  .epi .t3 { position: relative; max-width: 92vw; margin: 6px 0 4px; text-align: center; font-size: clamp(16px, 5.2vw, 76px); line-height: 1.1; color: #fff; text-shadow: 0 0 18px #000, 0 0 36px #000, 3px 3px 0 #000; }
  .epi .t4 { position: relative; margin-top: 14px; font-family: var(--marker); color: #fff; font-size: clamp(18px, 2.6vw, 34px); }

  /* ---------- kanji + title ---------- */
  #kanji { position: absolute; right: 3%; top: 50%; transform: translateY(-50%); z-index: 20; writing-mode: vertical-rl; white-space: nowrap; font-family: var(--jp); font-size: clamp(50px, calc(var(--u) * 13), 130px); letter-spacing: 8px; color: #fff; text-shadow: 0 0 25px var(--pink), 4px 4px 0 var(--dark); clip-path: inset(0 0 100% 0); opacity: 0; }
  #title { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); text-align: center; z-index: 25; pointer-events: none; opacity: 0; }
  #title .small { font-size: clamp(18px, 3.8vw, 44px); letter-spacing: 10px; color: #fff; text-shadow: 0 2px 0 #000, 0 0 10px #000; min-height: 1.3em; }
  #title .big { opacity: 0; white-space: nowrap; font-size: clamp(20px, 6.4vw, 100px); letter-spacing: 3px; line-height: 1; text-shadow: -4px 0 #00e5ff, 4px 0 var(--pink), 0 0 40px var(--red); }
  #title.glitch .big { animation: glitch 0.3s steps(2) 2; }
  @keyframes glitch {
    0% { transform: translate(0,0); clip-path: inset(0 0 0 0); }
    30% { transform: translate(-5px, 1px); clip-path: inset(10% 0 55% 0); }
    60% { transform: translate(4px, -2px); clip-path: inset(50% 0 10% 0); }
    100% { transform: translate(0,0); clip-path: inset(0 0 0 0); }
  }

  /* ---------- speech bubble: top right, tail points at him ---------- */
  #bubble { position: absolute; left: calc(2% + calc(var(--u) * 34)); top: 12%; width: min(46vw, 620px); z-index: 40; opacity: 0; pointer-events: none;
    filter: drop-shadow(3px 0 0 var(--pink)) drop-shadow(-3px 0 0 var(--pink)) drop-shadow(0 3px 0 var(--pink)) drop-shadow(0 -3px 0 var(--pink)) drop-shadow(10px 10px 0 rgba(0,0,0,0.7)); }
  #bubbleIn { min-height: 200px; padding: 40px 44px 78px calc(14% + 26px); display: flex; align-items: center; justify-content: center; text-align: center; background: #fff3f6; color: var(--ink);
    clip-path: polygon(14% 6.6%, 19.2% 0%, 26% 5.7%, 34.6% 0%, 43.2% 4.9%, 53.6% 0%, 63.9% 5.7%, 74.2% 0%, 84.5% 4.9%, 93.1% 0%, 100% 7.4%, 96.6% 24.6%, 100% 41%, 95.7% 59%, 100% 75.4%, 91.4% 82%, 81.1% 77%, 70.8% 82%, 60.4% 77%, 48.4% 82%, 38.1% 77%, 33% 81%, 25% 95%, 28% 79%, 19.2% 77%, 14% 72.2%, 17.4% 54%, 14% 37.7%, 18.3% 21.3%); }
  #txt { font-size: clamp(24px, 3.6vw, 52px); letter-spacing: 2px; line-height: 1.15; text-transform: uppercase; }
  #txt.hot { color: #0a0208; font-size: clamp(40px, 7vw, 112px); }
  .sfx { position: absolute; z-index: 45; font-family: var(--jp); font-weight: 900; font-size: clamp(60px, 14vw, 180px); color: #fff; -webkit-text-stroke: 3px #000; text-shadow: 6px 6px 0 var(--pink); pointer-events: none; opacity: 0; }

  /* ---------- finale: words on the right ---------- */
  #finale { position: absolute; inset: 0; z-index: 50; display: none; align-items: center; justify-content: center; perspective: 900px; padding: 0 calc(var(--u) * 14) 0 calc(2% + calc(var(--u) * 56)); background: radial-gradient(circle at 25% 50%, rgba(0,0,0,0.0), rgba(0,0,0,0.5)); }
  #fin3d { text-align: center; transform-style: preserve-3d; }
  #finale .hb { font-size: clamp(40px, 7.4vw, 150px); line-height: 1; letter-spacing: 4px; color: #ffd0e6; }
  #finale .nm { font-size: clamp(60px, 14vw, 250px); line-height: 1; color: #fff; }
  #finale .tf { margin-top: 14px; font-size: clamp(18px, 3.4vw, 54px); letter-spacing: 6px; color: #ffd6e6; opacity: 0; text-shadow: 0 0 20px var(--pink); }
  #replay { margin-top: 26px; padding: 10px 28px; background: transparent; border: 2px solid var(--pink); color: #ff9bc8; font-family: inherit; font-size: 16px; letter-spacing: 5px; cursor: pointer; opacity: 0; }
  #replay:hover { background: var(--pink); color: #fff; }
  #skip { position: absolute; right: 12px; top: 12px; z-index: 90; background: rgba(0,0,0,0.4); color: #888; border: 1px solid #444; font-family: inherit; font-size: 11px; letter-spacing: 3px; padding: 6px 10px; cursor: pointer; }
  #skip:hover { color: #fff; border-color: #fff; }

  @media (max-width: 760px) {
    #finale { align-items: flex-start; padding: calc(var(--u) * 12) 6vw 0; }
    #finale .hb { font-size: 10vw; } #finale .nm { font-size: 22vw; }
    #finale .tf { letter-spacing: 3px; font-size: 4.4vw; }
    #replay { margin-top: 14px; }
    #charWrap { height: calc(var(--u) * 68); width: calc(calc(var(--u) * 68) * 0.5625); }
    #charWrap.in { left: -4%; }
    #bubble { width: 74vw; left: 24%; top: 9%; }
    .bar.on { height: calc(var(--u) * 5); }
    .stampTxt.sm { white-space: normal; font-size: 7.6vw; line-height: 1.1; padding: 8px 14px; }
    #bubble.big1 { width: 86vw; left: 12%; }
    #bubble.shout { left: 6%; width: 88vw; top: 8%; }
    #bubble.shout #bubbleIn { padding: 46px 44px; min-height: 210px; }
    #credits { left: 4%; right: 4%; width: auto; top: calc(var(--u) * 9); bottom: calc(var(--u) * 62); }
    #bubbleIn { min-height: 150px; padding: 28px 24px 56px calc(14% + 14px); }
    #kanji { font-size: calc(var(--u) * 10); right: 2%; top: 58%; }
  }

  /* ---------- episode machinery ---------- */
  #shots { position: absolute; inset: 0; z-index: 28; pointer-events: none; overflow: hidden; }

[CHAR_DATA, 'char2.png', 'char3.png', 'assets/char2.png', 'assets/char3.png'].forEach((src, i) => {
  const im = new Image();
  im.onload = () => {
    im.dataset.name = 'p' + i;
    if (i === 0) im.classList.add('portrait');
    charInner.appendChild(im);
    poses.push(im);
    if (poses.length === 1) im.classList.add('show');
  };
  im.src = src;
});
let poseIdx = 0;
function hit(big) {
  if (rm) return;
  const s = big ? 1.05 : 1.025;
  charInner.animate([{ transform: 'scale(1)' }, { transform: 'scale(' + s + ')', offset: 0.3 }, { transform: 'scale(1)' }],
    { duration: big ? 800 : 600, easing: 'cubic-bezier(.3,.7,.3,1)', composite: 'add' });
  charGlow.animate([{ opacity: 1 }, { opacity: big ? 2.2 : 1.6, offset: 0.3 }, { opacity: 1 }], { duration: 700, easing: 'ease-out' });
}
function talk() {
  if (rm) return;
  charInner.animate([{ transform: 'scale(1) translateY(0)' }, { transform: 'scale(1.012) translateY(-3px)', offset: 0.4 }, { transform: 'scale(1) translateY(0)' }],
    { duration: 320, easing: 'ease-in-out', composite: 'add' });
}
function nextPose() {
  if (poses.length < 2) return;
  poses[poseIdx].classList.remove('show');
  poseIdx = (poseIdx + 1) % poses.length;
  poses[poseIdx].classList.add('show');
}
function faceZoom(scale, ms) {
  charInner.animate([{ transform: 'scale(1)' }, { transform: 'scale(' + scale + ')' }], { duration: ms, easing: 'cubic-bezier(.2,.7,.2,1)', fill: 'forwards' });
}

/* ---------- cursed lightning around him ---------- */
const bc = $('bolts'), bx = bc.getContext('2d');
let boltsOn = false;
function drawBolts() {
  bx.clearRect(0, 0, bc.width, bc.height);
  const ox = charX(), oy = bc.height * 0.5;
  const n = Math.floor(rand(3, 7));
  for (let i = 0; i < n; i++) {
    let x = ox + rand(-bc.width * 0.07, bc.width * 0.07), y = oy + rand(-bc.height * 0.3, bc.height * 0.3);
    const a = rand(0, 6.283), len = rand(0.12, 0.3) * bc.height;
    bx.beginPath(); bx.moveTo(x, y);
    for (let s = 0; s < 8; s++) {
      x += Math.cos(a) * len / 8 + rand(-18, 18);
      y += Math.sin(a) * len / 8 + rand(-18, 18);
      bx.lineTo(x, y);
    }
    bx.strokeStyle = Math.random() > 0.4 ? '#ff2fa8' : '#ffffff';
    bx.lineWidth = rand(1.5, 4);
    bx.shadowColor = '#ff1a2e'; bx.shadowBlur = 16;
    bx.stroke();
  }
  setTimeout(() => bx.clearRect(0, 0, bc.width, bc.height), 110);
}
(function boltLoop() {
  if (boltsOn && !rm) drawBolts();
  setTimeout(boltLoop, rand(500, 1100));
})();

/* ---------- fireworks ---------- */
const fc = $('fw'), fx = fc.getContext('2d');
let sparks2 = [], fwOn = false, fwDirty = false;
function burst() {
  const x = rand(fc.width * 0.3, fc.width * 0.95), y = rand(fc.height * 0.12, fc.height * 0.55);
  const col = ['255,47,168', '255,26,46', '255,255,255', '255,210,110'][Math.floor(rand(0, 4))];
  for (let i = 0; i < 70; i++) {
    const a = rand(0, 6.283), v = rand(1.5, 7);
    sparks2.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 1, col });
  }
  noise(0.25, 0.08, 2200, 300);
  tone(rand(300, 520), 0.3, 'triangle', 0.035, 90);
}

/* ---------- smooth text: every letter eases in ---------- */
function spanText(el, text) {
  el.textContent = '';
  const out = [];
  const words = text.split(' ');
  words.forEach((word, wi) => {
    const w = document.createElement('span');
    w.style.display = 'inline-block'; w.style.whiteSpace = 'nowrap';
    [...word].forEach(ch => {
      const s = document.createElement('span');
      s.textContent = ch; s.style.display = 'inline-block'; s.style.opacity = 0;
      w.appendChild(s); out.push(s);
    });
    el.appendChild(w);
    if (wi < words.length - 1) el.appendChild(document.createTextNode(' '));
  });
  return out;
}

const cc = $('confetti'), cx2 = cc.getContext('2d');

function spawnBits(n) {
  for (let i = 0; i < n; i++) bits.push({ x: rand(0, cc.width), y: rand(-cc.height * 0.4, -10), w: rand(7, 15), h: rand(5, 9), vy: rand(2, 4.5), vx: rand(-1, 1), r: rand(0, 6), vr: rand(-0.12, 0.12), f: rand(0, 6), vf: rand(0.05, 0.18), c: cols[Math.floor(rand(0, cols.length))] });
}
function drawBits() {
  if (bits.length || confDirty) {
    cx2.clearRect(0, 0, cc.width, cc.height);
    confDirty = bits.length > 0;
    for (const b of bits) {
      b.y += b.vy; b.x += b.vx + Math.sin(b.y / 30) * 0.5; b.r += b.vr; b.f += b.vf;
      cx2.save(); cx2.translate(b.x, b.y); cx2.rotate(b.r); cx2.scale(1, Math.cos(b.f));
      cx2.fillStyle = b.c; cx2.fillRect(-b.w / 2, -b.h / 2, b.w, b.h); cx2.restore();

/* ---------- 3D extruded text ---------- */
function extrude(el, n, c1, c2, glow) {
  const s = [];
  for (let i = 1; i <= n; i++) {
    const k = i / n;
    const c = c1.map((v, j) => Math.round(v + (c2[j] - v) * k));
    s.push(i + 'px ' + i + 'px 0 rgb(' + c.join(',') + ')');
  }
  s.push('0 0 50px ' + glow);
  el.style.textShadow = s.join(',');
}

function shatterLetter() {
  const r = letter.getBoundingClientRect();
  const lw = letter.offsetWidth, lh = letter.offsetHeight;
  const sc = r.width / lw;
  const pts = [[0, 0], [50, 0], [100, 0], [100, 50], [100, 100], [50, 100], [0, 100], [0, 50]];
  const c = [50 + rand(-8, 8), 50 + rand(-8, 8)];
  pts.forEach((p, i) => {
    const q = pts[(i + 1) % pts.length];
    const s = letter.cloneNode(true);
    s.removeAttribute('id');
    s.className = 'box3d shard';
    s.style.left = (r.left + r.width / 2 - lw / 2) + 'px';
    s.style.top = (r.top + r.height / 2 - lh / 2) + 'px';
    s.style.width = lw + 'px';
    s.style.height = lh + 'px';
    s.style.position = 'absolute';
    s.style.transform = 'scale(' + sc + ')';
    s.style.clipPath = 'polygon(' + c[0] + '% ' + c[1] + '%,' + p[0] + '% ' + p[1] + '%,' + q[0] + '% ' + q[1] + '%)';
    shardLayer.appendChild(s);
    const mx = (p[0] + q[0]) / 2 - 50, my = (p[1] + q[1]) / 2 - 50;
    s.animate([

  kanji.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 700, fill: 'forwards' });
  const cr = $('credits'), roll = cr.firstElementChild;
  roll.innerHTML = creditRows.map(r => '<div class="blk">' + (r[0] ? '<div class="r">' + r[0] + '</div>' : '') + '<div class="n">' + r[1] + '</div>' + (r[2] ? '<div class="s">' + r[2] + '</div>' : '') + '</div>').join('');
  cr.style.display = 'block';
  roll.animate([{ transform: 'translateY(' + cr.clientHeight + 'px)' }, { transform: 'translateY(' + (-roll.scrollHeight) + 'px)' }], { duration: 15000, easing: 'linear', fill: 'forwards' });
  await wait(15000);
  cr.style.display = 'none';
}
async function nextEp() {
  fin3d.getAnimations().forEach(a => a.cancel());
  kanji.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 800, fill: 'forwards' });
  chime();
  musicStop();
}
async function tail(w) {
  await wait(w);
  await credits();
  await nextEp();
}

/* ---------- main sequence ---------- */
let running = false;
async function run() {
  if (running) return;
  running = true;
  initAudio();
  hint.style.display = 'none';
  document.querySelector('.eText').animate([{ opacity: 1 }, { opacity: 0 }], { duration: 300, fill: 'forwards' });
  rig.style.animation = 'none';

  // 1 the seal cracks
  crack(); flash(350, '#ff6b9a', 0.5); shake(14);
  sealBurst();
  aura.style.opacity = 1;
  await wait(380);

  // 2 flap opens in 3D
  paper();
  flapWrap.animate([
    { transform: 'translateZ(4px) rotateX(0deg)' },
    { transform: 'translateZ(2px) rotateX(-90deg)', offset: 0.5 },
    { transform: 'translateZ(-3px) rotateX(-180deg)' }
  ], { duration: 1000, easing: 'cubic-bezier(.3,.1,.2,1)', fill: 'forwards' });
  await wait(950);

  // 3 letter slides out and floats at the camera
  godrays.classList.add('on');
  const s = Math.min(1.85, innerWidth * 0.8 / (env.offsetWidth * 0.9));
  const z = 1200 * (1 - 1 / s);
  paper();
  letter.animate([
    { transform: 'translate3d(0,0,1px) rotateZ(0deg)' },
    { transform: 'translate3d(0,-72%,1px) rotateZ(0deg)', offset: 0.42 },
    { transform: 'translate3d(0,-60%,' + z * 0.5 + 'px) rotateZ(-4deg)', offset: 0.72 },
    { transform: 'translate3d(0,0,' + z + 'px) rotateZ(0deg)' }
  ], { duration: 1700, easing: 'ease-in-out', fill: 'forwards' });
  await wait(1050);
  env.animate([
    { transform: 'translate3d(0,0,0) rotateX(0deg) rotateZ(0deg)', opacity: 1 },
    { transform: 'translate3d(0,calc(var(--u) * 70),-200px) rotateX(35deg) rotateZ(8deg)', opacity: 0 }
  ], { duration: 1000, easing: 'ease-in', fill: 'forwards' });
  await wait(1000);
  whoosh();
  await wait(550);

  // 4 slash it open, the letter shatters
  riser();
  await slashBurst(7);
  flash(600, '#fff', 0.85); boom(); shake(36); ring(true);
  godrays.classList.remove('on');
  shatterLetter();
  await wait(280);
  await blackFlash();
  env.style.display = 'none';
  await wait(150);

  // 5 you get pulled INTO the anime
  barTop.classList.add('on'); barBot.classList.add('on');
  await warpIn();

  // 6 domain expansion title
  kanji.style.opacity = 1;
  kanji.animate([{ clipPath: 'inset(0 0 100% 0)' }, { clipPath: 'inset(0 0 0% 0)' }], { duration: 1100, easing: 'ease-out', fill: 'forwards' });
  title.style.opacity = 1;
  const small = spanText(tSmall, 'DOMAIN EXPANSION');
  small.forEach((sp2, i) => {
    sp2.animate([{ opacity: 0, transform: 'translateY(10px)' }, { opacity: 1, transform: 'translateY(0)' }], { duration: 400, delay: i * 55, easing: 'ease-out', fill: 'forwards' });
    setTimeout(blip, i * 55);
  });
  await wait(small.length * 55 + 350);
  title.querySelector('.big').animate([{ opacity: 0, transform: 'scale(2)' }, { opacity: 1, transform: 'scale(1)' }], { duration: 700, easing: 'cubic-bezier(.1,.9,.2,1)', fill: 'forwards' });
  boom(); shake(36); flash(450, '#ff6b9a', 0.6); ring(true);
  title.classList.add('glitch');
  sfxWord('ゴゴゴ');
  await wait(1900);
  title.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 700, fill: 'forwards' });
  kanji.animate([{ opacity: 1 }, { opacity: 0.18 }], { duration: 900, fill: 'forwards' });
  await wait(600);

  // 6b opening sequence
  await opSequence();

  // 7 anime episode title card
  const clearCard = await episodeCard();

  // 8 he appears (left side)
  whoosh();
  charWrap.classList.add('in');
  if (poses[0]) poses[0].animate([
    { clipPath: 'polygon(0 0, 0 0, 0 100%, 0 100%)' },
    { clipPath: 'polygon(-10% 0, 110% 0, 110% 100%, -10% 100%)' }
  ], { duration: 800, easing: 'cubic-bezier(.1,.9,.2,1)' });
  clearCard();
  slash(innerWidth * -0.05, innerHeight * 0.2, 24, innerWidth * 0.8);
  setTimeout(() => slash(innerWidth * -0.05, innerHeight * 0.75, -22, innerWidth * 0.8), 160);
  ring(false);
  boltsOn = true; auraOn = true;
  speedLines(1100);
  shake(22);
  sfxWord('ババッ');
  await wait(1200);
  charWrap.classList.add('float');
  await wait(300);

  // 9 dialogue: he talks, the camera creeps in
  const rolls = [0, -1.5, 1.2, -3, 0];
  const shotsFor = [null, 'face', 'hand', 'eyes', null];
  for (let i = 0; i < msgs.length - 1; i++) {
    rollTarget = rolls[i];
    dollyTarget += 14;
    if (i > 0) {
      slashBurst(2);
      sfxWord(sfxWords[i % sfxWords.length]);
      nextPose();
    }
    const sh = shotsFor[i];
    if (sh) await cutTo(sh, i === 1 ? 'slice' : 'hard');
    else if (curShot) await clearShot();
    await say(msgs[i], false);
    await wait(1600);
  }

  // straight from the last line into the birthday screen
  await clearShot();
  bubble.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 250, fill: 'forwards' });
  rollTarget = 0;
  dollyTarget += 40;
  await impactFrame();
  flash(500, '#fff', 0.8);
  boom();
  speedLines(900);
  slashBurst(5);
  emberBoost = 2.4;
  faceZoom(1.45, 1500);
  await wait(500);

  // 10 finale
  await showFinale();
  await tail(9000);
}

// once he is on screen, every click slashes the scene
stage.addEventListener('pointerdown', e => {
  if (!charWrap.classList.contains('in')) return;
  slash(e.clientX - 260, e.clientY + rand(-60, 60), rand(-35, 35), 520);
  hit(true); shake(8); flash(160, '#ff6b9a', 0.3);
});

env.addEventListener('click', run);
letter.addEventListener('click', run);
hint.addEventListener('click', run);

if (location.search.indexOf('debug') > -1) {
  running = true;
  env.style.display = 'none';
  letter.style.display = 'none';
  hint.style.display = 'none';
  domainOn();
  revealProps(true);
  charWrap.classList.add('in');
  faceZoom(1.2, 1);
  heartbeatStart();
  setTimeout(async () => { await showFinale(); await tail(1500); }, 400);
}
if (location.search.indexOf('auto') > -1) setTimeout(run, 400);
if (matchMedia('(pointer: coarse)').matches) hint.textContent = 'TAP THE SEAL';
</script>
</body>
</html>
